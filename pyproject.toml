[project]
name = "tally-mcp"
version = "0.1.0"
description = "MCP server giving AI agents live access to the companies loaded in TallyPrime"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tally-mcp = "tally_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally_mcp"]

[tool.pytest.ini_options]
markers = ["live: needs a running TallyPrime on TALLY_URL (deselect with -m 'not live')"]
